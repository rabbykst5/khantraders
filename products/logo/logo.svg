<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- আধুনিক ডিপ টেক ডার্ক ব্যাকগ্রাউন্ড গ্রেডিয়েন্ট -->
    <linearGradient id="proBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1b2b" />
      <stop offset="50%" stop-color="#06111f" />
      <stop offset="100%" stop-color="#02060d" />
    </linearGradient>

    <!-- প্রিমিয়াম ভাইব্রেন্ট গ্রিন গ্রেডিয়েন্ট -->
    <linearGradient id="vibrantGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>

    <!-- প্রিমিয়াম ব্রাইট সাইয়ান ও ব্লু গ্রেডিয়েন্ট -->
    <linearGradient id="brightCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- গ্লোয়িং এবং ড্রপ শ্যাডো ইফেক্ট -->
    <filter id="superGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- ব্যাকগ্রাউন্ড রাউন্ডেড কার্ড -->
  <rect width="500" height="500" rx="110" fill="url(#proBg)" stroke="rgba(34,211,238,0.2)" stroke-width="2" />

  <!-- ব্যাকগ্রাউন্ড নেটওয়ার্ক সিগন্যাল ওয়েভ (আর্টওয়ার্ক ডিটেইল বাড়ানোর জন্য) -->
  <g opacity="0.25">
    <path d="M 270 120 A 110 110 0 0 1 380 230" fill="none" stroke="#22d3ee" stroke-width="6" stroke-linecap="round" />
    <path d="M 300 150 A 70 70 0 0 1 370 220" fill="none" stroke="#4ade80" stroke-width="5" stroke-linecap="round" />
    <path d="M 330 180 A 30 30 0 0 1 360 210" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- মূল 'KT' টেক্সট ডিজাইন -->
  <g filter="url(#superGlow)">
    <!-- K অক্ষর -->
    <path d="M 105 130 V 370 M 105 250 L 205 130 M 160 215 L 215 370" 
          fill="none" stroke="url(#brightCyan)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- T অক্ষর -->
    <path d="M 255 140 H 385 M 320 140 V 370" 
          fill="none" stroke="url(#vibrantGreen)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- কানেক্টিভিটি স্পিড ডেকোরেশন কার্ভ -->
  <path d="M 85 410 C 180 445, 320 445, 415 330" fill="none" stroke="url(#vibrantGreen)" stroke-width="12" stroke-linecap="round" filter="url(#superGlow)" opacity="0.9" />
</svg>
