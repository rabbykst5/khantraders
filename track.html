<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#06111f">
  <meta name="description" content="Khan Traders — অর্ডার ট্র্যাকিং">
  <title>অর্ডার ট্র্যাকিং — Khan Traders</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root{
      --bg:#030914;
      --panel:rgba(8,22,40,.78);
      --cyan:#22d3ee;
      --text:#f1f5f9;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      color:var(--text);
      background:
        radial-gradient(circle at 15% 10%, rgba(34,211,238,.10), transparent 28%),
        radial-gradient(circle at 85% 15%, rgba(139,92,246,.12), transparent 30%),
        var(--bg);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Bengali",sans-serif;
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }
    .glass{
      background:var(--panel);
      border:1px solid rgba(148,163,184,.13);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
    }
    .track-input:focus{
      outline:none;
      border-color:rgba(34,211,238,.65);
      box-shadow:0 0 0 3px rgba(34,211,238,.1);
    }
    .step-item{position:relative;display:flex;gap:16px;padding-bottom:28px}
    .step-item:last-child{padding-bottom:0}
    .step-line{position:absolute;left:15px;top:32px;bottom:0;width:2px;background:rgba(148,163,184,.2)}
    .step-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;z-index:2;flex-shrink:0}
    .step-item.active .step-dot{background:#22d3ee;color:#03131c;box-shadow:0 0 16px rgba(34,211,238,.5)}
    .step-item.done .step-dot{background:#10b981;color:#fff}
    .step-item.pending .step-dot{background:rgba(148,163,184,.15);color:#64748b;border:1px solid rgba(148,163,184,.2)}
  </style>
</head>

<body>
  <!-- Header -->
  <header class="sticky top-0 z-50 border-b border-cyan-400/10 bg-[#030914]/85 backdrop-blur-xl">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <img src="logo.jpg" alt="Logo" class="w-10 h-10 object-contain rounded-xl" onerror="this.style.display='none'">
        <div>
          <div class="font-black text-lg">Khan Traders</div>
          <div class="text-[10px] text-slate-400">অর্ডার ট্র্যাকিং পেজ</div>
        </div>
      </a>
      <a href="index.html" class="px-4 py-2 rounded-xl glass text-sm font-semibold hover:border-cyan-400/40 transition">← হোম</a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-2xl w-full mx-auto px-4 py-10">
    <div class="glass rounded-3xl p-6 sm:p-8 shadow-2xl">
      <div class="text-center mb-6">
        <div class="text-4xl mb-2">🔍</div>
        <h1 class="text-2xl font-black">আপনার অর্ডারের অবস্থা জানুন</h1>
        <p class="text-xs sm:text-sm text-slate-400 mt-1">অর্ডার নিশ্চিতকরণে পাওয়া আইডি (যেমন: KT261002-XXXX) দিন</p>
      </div>

      <!-- Search Box -->
      <form id="trackForm" class="flex gap-2">
        <input 
          id="orderIdInput" 
          type="text" 
          placeholder="যেমন: KT261002-ABCD" 
          required 
          class="track-input flex-1 glass rounded-2xl px-4 py-3.5 text-sm uppercase font-bold tracking-wider text-slate-100 placeholder:normal-case placeholder:font-normal placeholder:text-slate-500"
        >
        <button type="submit" id="searchBtn" class="px-6 py-3.5 rounded-2xl bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-black text-sm transition flex-shrink-0">
          খুঁজুন
        </button>
      </form>

      <!-- Error / Alert Box -->
      <div id="statusAlert" class="hidden mt-4 p-4 rounded-2xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs sm:text-sm text-center"></div>

      <!-- Order Result Box -->
      <div id="resultBox" class="hidden mt-8 pt-8 border-t border-cyan-400/10">
        
        <!-- Header Info -->
        <div class="flex items-center justify-between mb-4 pb-4 border-b border-slate-800">
          <div>
            <div class="text-xs text-slate-500">গ্রাহকের নাম ও অর্ডার নম্বর</div>
            <div id="resCustomerName" class="font-bold text-slate-200 text-sm"></div>
            <div id="resOrderId" class="font-black text-cyan-300 text-base mt-0.5"></div>
          </div>
          <div class="text-right">
            <div class="text-xs text-slate-500">পরিশোধযোগ্য বিল</div>
            <div id="resTotal" class="font-black text-emerald-400 text-lg"></div>
          </div>
        </div>

        <!-- Payment Info Card (নতুন যুক্ত করা হয়েছে) -->
        <div class="mb-6 p-3.5 rounded-2xl bg-white/[0.03] border border-white/10 flex flex-wrap items-center justify-between gap-3 text-xs">
          <div class="flex items-center gap-2">
            <span class="text-slate-400">পেমেন্ট মেথড:</span>
            <span id="resPayMethod" class="font-bold px-2.5 py-1 rounded-lg bg-cyan-400/10 text-cyan-300 border border-cyan-400/20"></span>
          </div>
          <div id="resTrxContainer" class="hidden flex items-center gap-2">
            <span class="text-slate-400">TrxID:</span>
            <span id="resTrxId" class="font-mono font-bold px-2 py-0.5 rounded-md bg-pink-500/10 text-pink-400 border border-pink-500/20"></span>
          </div>
        </div>

        <!-- Stepper Visualizer -->
        <div id="stepperContainer"></div>

        <div class="mt-8 p-4 rounded-2xl bg-cyan-400/5 border border-cyan-300/10 text-xs text-slate-400 text-center leading-6">
          জরুরি প্রয়োজনে হটলাইনে যোগাযোগ করুন: <br>
          📞 <a href="tel:01751297055" class="text-cyan-300 font-bold">01751297055</a>
        </div>
      </div>
    </div>
  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx9Y5Dp1VSBPc4FAlxuQ9vXyuY_dC9-XYRubqTRrLUpb7SWiGhwkxwfYct4_3hvLyHS/exec";

    const form = document.getElementById('trackForm');
    const input = document.getElementById('orderIdInput');
    const alertBox = document.getElementById('statusAlert');
    const resultBox = document.getElementById('resultBox');
    const btn = document.getElementById('searchBtn');

    const STEPS = [
      { id: 1, title: 'অর্ডার পেন্ডিং', desc: 'অর্ডারটি সিস্টেমে গৃহীত হয়েছে' },
      { id: 2, title: 'অর্ডার কনফার্মড', desc: 'প্রতিনিধি ফোনে কথা বলে অর্ডার নিশ্চিত করেছেন' },
      { id: 3, title: 'প্যাকেজিং ও ডিসপ্যাচ', desc: 'পণ্য প্যাকেট করে কুরিয়ারে হস্তান্তর করা হয়েছে' },
      { id: 4, title: 'ডেলিভারি সম্পন্ন', desc: 'পণ্য আপনার ঠিকানায় পৌঁছে দেওয়া হয়েছে' }
    ];

    function renderStepper(currentStep) {
      const container = document.getElementById('stepperContainer');
      container.innerHTML = STEPS.map((step, idx) => {
        let status = 'pending';
        let icon = step.id;

        if (step.id < currentStep) {
          status = 'done';
          icon = '✓';
        } else if (step.id === currentStep) {
          status = 'active';
        }

        const isLast = idx === STEPS.length - 1;

        return `
          <div class="step-item ${status}">
            ${!isLast ? '<div class="step-line"></div>' : ''}
            <div class="step-dot">${icon}</div>
            <div>
              <div class="text-sm font-bold ${status === 'active' ? 'text-cyan-300' : (status === 'done' ? 'text-emerald-400' : 'text-slate-500')}">${step.title}</div>
              <div class="text-xs text-slate-400 mt-0.5">${step.desc}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const orderId = input.value.trim().toUpperCase();
      alertBox.classList.add('hidden');
      resultBox.classList.add('hidden');

      btn.textContent = 'খোঁজা হচ্ছে...';
      btn.disabled = true;

      try {
        const response = await fetch(`${SCRIPT_URL}?id=${encodeURIComponent(orderId)}`);
        const data = await response.json();

        if (data && data.found) {
          document.getElementById('resCustomerName').textContent = data.name || 'গ্রাহক';
          document.getElementById('resOrderId').textContent = data.orderId;
          document.getElementById('resTotal').textContent = data.total ? ('৳ ' + Number(data.total).toLocaleString('en-BD')) : '৳ ০';

          // পেমেন্ট মেথড ও TrxID প্রদর্শন লজিক
          const payMethodEl = document.getElementById('resPayMethod');
          const trxContainer = document.getElementById('resTrxContainer');
          const trxIdEl = document.getElementById('resTrxId');

          const isMFS = data.payMethod && (data.payMethod.includes('বিকাশ') || data.payMethod.includes('নগদ') || data.payMethod.includes('mfs'));
          payMethodEl.textContent = isMFS ? 'বিকাশ / নগদ' : (data.payMethod || 'ক্যাশ অন ডেলিভারি');

          if (isMFS) {
            payMethodEl.className = 'font-bold px-2.5 py-1 rounded-lg bg-pink-500/10 text-pink-400 border border-pink-500/20';
          } else {
            payMethodEl.className = 'font-bold px-2.5 py-1 rounded-lg bg-cyan-400/10 text-cyan-300 border border-cyan-400/20';
          }

          if (data.trxId && data.trxId !== 'N/A' && data.trxId.trim() !== '') {
            trxIdEl.textContent = data.trxId;
            trxContainer.classList.remove('hidden');
          } else {
            trxContainer.classList.add('hidden');
          }

          // স্ট্যাটাস নির্ধারণ
          let stepNumber = 1;
          const st = String(data.status || '').toLowerCase();
          
          if (st.includes('কনফার্ম') || st.includes('confirmed')) stepNumber = 2;
          else if (st.includes('ডিসপ্যাচ') || st.includes('প্যাকিং') || st.includes('dispatch') || st.includes('courier')) stepNumber = 3;
          else if (st.includes('ডেলিভার্ড') || st.includes('সম্পন্ন') || st.includes('delivered')) stepNumber = 4;
          else stepNumber = 1;

          renderStepper(stepNumber);
          resultBox.classList.remove('hidden');
        } else {
          alertBox.textContent = 'পণ্যটির কোনো তথ্য পাওয়া যায়নি। অনুগ্রহ করে সঠিক অর্ডার আইডি দিন।';
          alertBox.classList.remove('hidden');
        }
      } catch (error) {
        alertBox.textContent = 'গুগল শিট সার্ভারের সাথে সংযোগে সমস্যা হচ্ছে। ইন্টারনেট চেক করে আবার চেষ্টা করুন।';
        alertBox.classList.remove('hidden');
      } finally {
        btn.textContent = 'খুঁজুন';
        btn.disabled = false;
      }
    });

    // URL কোয়েরি প্যারামিটার চেক (track.html?id=KT...)
    const urlParams = new URLSearchParams(window.location.search);
    const prefillId = urlParams.get('id');
    if (prefillId) {
      input.value = prefillId;
      form.dispatchEvent(new Event('submit'));
    }
  </script>
</body>
</html>
